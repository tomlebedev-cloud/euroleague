name: Update EuroLeague data

on:
  schedule:
    # Quick checks around game time: every half hour in the evening and hourly through the night (UTC).
    # They only do a full update when a game has finished since the last one (update_data.py --if-new).
    - cron: "13,43 16-23 * * *"
    - cron: "13 0-4 * * *"
    # Full update every morning (rosters, schedule changes), whether or not games were played.
    - cron: "23 5 * * *"
  workflow_dispatch: # allows running it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Finished box scores never change; keep them between runs so only new games are downloaded.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: euroleague-cache-${{ github.run_id }}
          restore-keys: euroleague-cache-

      - name: Download data
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "23 5 * * *" ]; then
            python -u update_data.py --if-new
          else
            python -u update_data.py
          fi

      - name: Commit if anything changed
        run: |
          # data.js always contains a new "updated" time; only commit when the real data changed
          if git diff --quiet -I '^const UPDATED' -- js/data.js; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git commit -m "Update EuroLeague data ($(date -u +%Y-%m-%d))"
          git push
